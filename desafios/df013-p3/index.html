<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }
        table{
            border: 1px solid black;
            border-collapse: collapse;
        }
        th, tr, td{
            border: 1px solid black;
            padding: 10px;
        }
        .grey{
            background-color: grey;
            color: white;
            font-weight: bold;
        }
        .media{
            text-align: left;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th class="grey" rowspan="2" scope="colgroup">Área</th>
                <th class="grey" rowspan="2" scope="colgroup">Disciplina</th>
                <th class="grey" colspan="2" scope="colgroup">Notas</th>
                <th class="grey" rowspan="2" scope="colgroup">Média</th>
            </tr>
            <tr>
                <th class="grey" scope="col">Nota 1</th>
                <th class="grey" scope="col">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th class="grey media" colspan="4" scope="row">Média de exatas</th>
                <td class="grey">0.0</td>
            </tr>
            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th class="grey media" colspan="4" scope="row">Média de Humanas</th>
                <td class="grey">0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
