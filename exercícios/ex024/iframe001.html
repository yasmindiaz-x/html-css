<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe{
            width: 400px;
            height: 400px;
            border: 2px dashed black;
        }
    </style>
</head>
<body>
    <!-- 
    TAMANHO PADRÃO DE iframe
    300x500 pixels

    CSS tem prioridade

    PARAMETRO DO scrolling: em alguns navegadores o scrolling="auto", "yes" e "no" pode não funcionar em alguns navegadores
    -->
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do
        
        <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500px"></iframe> 
        para aprender a programar</p>

        <p>O site do 
            <iframe src="https://www.google.com.br" frameborder="0"></iframe> 
                <a href="https://www.google.com.br" target="_blank">Acessando o Google</a>
            
            também é muito legal, pena que nao funciona dentro do iframe</p>

        <p>O repositório do Guanabara

            <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="500px" width="500px" scrolling=""></iframe>

            também é bem legal
        </p>
</body>
</html>
